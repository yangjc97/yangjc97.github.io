# Identity and hosting
title: blank
first_name: Jichang
last_name: Yang
lang: en
url: https://yangjc97.github.io
baseurl: ""
description: Academic homepage of Jichang Yang (杨佶昌), a Postdoctoral Fellow in the Department of Electrical and Computer Engineering, HKU, also affiliated with CASIC, supervised by Prof. Han Wang and researching RRAM-based in-memory computing, analog circuits and Edge AI.
keywords: Jichang Yang, 杨佶昌, HKU, RRAM, in-memory computing, Edge AI
contact_note: Email is the best way to reach me.
footer_text: >
  Powered by <a href="https://jekyllrb.com/">Jekyll</a> and
  <a href="https://github.com/alshedivat/al-folio">al-folio</a>.
icon: favicon.svg
apple_touch_icon: apple-touch-icon-180x180.png
og_image: /assets/img/avatar.png
serve_og_meta: true
serve_schema_org: true
google_site_verification:
enable_google_verification: false

# Official al-folio v1 runtime; no copied theme internals.
theme: al_folio_core
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false

# Presentation
max_width: 960px
navbar_fixed: true
footer_fixed: false
last_updated: false
enable_darkmode: true
search_enabled: false
bib_search: false
back_to_top: false
enable_masonry: false
enable_math: false
enable_medium_zoom: false
enable_progressbar: false
enable_tooltips: false
enable_navbar_social: false
protect_email: false
lazy_loading_images: true
imagemagick:
  enabled: false

# Content records feed the lists; individual detail pages are disabled.
collections:
  publications:
    output: false
  talks:
    output: false
  teaching:
    output: false
  news:
    output: false
future: true
timezone: Asia/Hong_Kong
include: ["_pages"]
exclude:
  - Curriculum_Vitae___Jichang_Yang-2.pdf
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - compose.yaml
  - scripts
  - docs
  - other papers
  - vendor
  - .bundle
  - .jekyll-cache
  - .github
  - .ruby-version
  - .gitignore
  - .al-folio-overrides.yml
  - al-folio-upgrade-report.md
  - AGENTS.md
keep_files: [CNAME, .nojekyll]
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
sass:
  style: compressed
plugins:
  - jekyll-cache-bust
  - jekyll-socials
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
  - al_folio_core
  - al_icons

# Only the external libraries actually used by the theme.
third_party_libraries:
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700&display=swap"
  fontawesome:
    version: "7.2.0"
    url:
      css: "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css"
    integrity:
      css: "sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c="
  academicons:
    version: "1.9.5"
    url:
      css: "https://cdn.jsdelivr.net/npm/academicons@1.9.5/css/academicons.min.css"
    integrity:
      css: "sha256-SzrCOBJbGVFMahewkgjwnApaV2+av1DwMAA+/QGLyZw="
  scholar-icons:
    version: "1.0.3"
    url:
      css: "https://cdn.jsdelivr.net/npm/scholar-icons@1.0.3/css/scholar-icons.css"
    integrity:
      css: "sha256-VY3hHVj/hNX3fYG6wtbA6TcKJQl7+FthzGSyIB64klY="
